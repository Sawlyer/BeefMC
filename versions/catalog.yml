    build:
      family: modern
      jdk: 21
      runtime_java: 21
      patch_roots:
        - leaf-api/paper-patches
        - leaf-server/paper-patches
      apply_command: "./gradlew applyAllPatches"
      check_command: "./gradlew build"
      jar_command: "./gradlew :beefmc-server:createMojmapPaperclipJar"
      jar_path: "leaf-server/build/libs/beefmc-paperclip-*.jar"
