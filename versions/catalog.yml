schema_version: 1
versions:
  - minecraft: "1.8.8"
    branch: version/1.8.8
    upstream:
      repository: hpfxd/PandaSpigot
      ref: master
      commit: 1afa5656056df41dd6fec8383927b925c729623d
    build:
      family: legacy
      jdk: 17
      runtime_java: 8
      patch_roots:
        - patches/api
        - patches/server
      apply_command: "./beefmc setup"
      check_command: "./gradlew build --stacktrace"
      jar_command: "./beefmc jar"
      jar_path: "beefmc-1.8.8.jar"
    status: build-checked
    release:
      tag_pattern: "v{release}"
      asset_name: "BeefMC-1.8.8-v{release}.jar"
  - minecraft: "1.21.11"
