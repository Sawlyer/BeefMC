name: EN | Feature request
description: Suggest an idea to improve BeefMC
type: "Feature"

body:
  - type: markdown
    attributes:
      value: |
        Describe the problem this feature would solve and how it should work in BeefMC.
  - type: textarea
    attributes:
      label: What feature do you want to see added?
      description: A clear and concise description of your feature request.
    validations:
      required: true
