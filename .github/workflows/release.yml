name: BeefMC release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout tagged BeefMC catalog
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install catalog parser
        run: python -m pip install --disable-pip-version-check -r scripts/versioning/requirements.txt
      - name: Validate catalog and version tools
        run: |
          python scripts/versioning/catalog.py validate
          python -m unittest discover -s tests/versioning -v
      - name: Validate release and resolve all versions
        id: matrix
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          args=()
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          python scripts/versioning/release.py validate "$RELEASE_TAG" "$RELEASE_COMMIT" "${args[@]}" >> "$GITHUB_OUTPUT"
          python scripts/versioning/catalog.py matrix all >> "$GITHUB_OUTPUT"

  build:
    name: Build Minecraft ${{ matrix.minecraft }}
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout version source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          submodules: recursive
          path: source
      - name: Checkout tagged BeefMC tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          path: tooling
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install release tooling dependencies
        run: python -m pip install --disable-pip-version-check -r tooling/scripts/versioning/requirements.txt
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.build_jdk }}
      - name: Configure Git for patch generation
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: Apply BeefMC legacy patch set
        if: matrix.build_family == 'legacy'
        working-directory: source
        run: ./beefmc setup
      - name: Set BeefMC legacy build identity
        if: matrix.build_family == 'legacy'
        working-directory: source
        env:
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: python ../tooling/scripts/versioning/rebrand.py apply --source-root . --version "$MINECRAFT_VERSION" --family legacy
      - name: Build BeefMC 1.8.8 jar
        if: matrix.build_family == 'legacy'
        working-directory: source
        run: ./beefmc jar
      - name: Apply modern patch set
        if: matrix.build_family == 'modern'
        working-directory: source
        run: ./gradlew applyAllPatches --stacktrace --no-daemon
      - name: Set BeefMC build identity
        if: matrix.build_family == 'modern'
        working-directory: source
        env:
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: python ../tooling/scripts/versioning/rebrand.py apply --source-root . --version "$MINECRAFT_VERSION" --family modern
      - name: Build modern server jar
        if: matrix.build_family == 'modern'
        working-directory: source
        env:
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: |
          ./gradlew build --stacktrace --no-daemon
          if [[ "$MINECRAFT_VERSION" == "1.21.11" ]]; then
            ./gradlew :beefmc-server:createMojmapPaperclipJar --no-daemon
          else
            ./gradlew :beefmc-server:createPaperclipJar --no-daemon
          fi
      - name: Package jar and SHA-256 checksum
        working-directory: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: python ../tooling/scripts/versioning/release.py package "$RELEASE_TAG" "$MINECRAFT_VERSION" --source-root . --catalog ../tooling/versions/catalog.yml
      - name: Store release assets
        uses: actions/upload-artifact@v7
        with:
          name: beefmc-release-assets-${{ github.event.release.tag_name }}-${{ matrix.minecraft }}
          path: source/dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Attach jars and checksums
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: beefmc-release-assets-${{ github.event.release.tag_name }}-*
          path: dist
          merge-multiple: true
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
