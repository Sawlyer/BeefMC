name: BeefMC version build

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref containing source to build
        required: true
        type: string
      version_branch:
        description: Catalog branch key for the selected Minecraft version
        required: true
        type: string
      tooling_ref:
        description: Ref containing BeefMC catalog and scripts
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      minecraft: ${{ steps.version.outputs.minecraft }}
      build_family: ${{ steps.version.outputs.build_family }}
      build_jdk: ${{ steps.version.outputs.build_jdk }}
    steps:
      - name: Checkout BeefMC tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tooling_ref }}
          path: tooling
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install catalog parser
        working-directory: tooling
        run: python -m pip install --disable-pip-version-check -r scripts/versioning/requirements.txt
      - name: Validate catalog and resolve branch
        id: version
        working-directory: tooling
        env:
          BEEFMC_BRANCH: ${{ inputs.version_branch }}
        run: |
          python scripts/versioning/catalog.py validate
          python scripts/versioning/catalog.py resolve-branch "$BEEFMC_BRANCH" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout selected version source
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          path: source
      - name: Checkout BeefMC test tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tooling_ref }}
          path: tooling
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ needs.resolve.outputs.build_jdk }}
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ needs.resolve.outputs.minecraft }}-${{ needs.resolve.outputs.build_family }}-jdk${{ needs.resolve.outputs.build_jdk }}-${{ runner.os }}-${{ hashFiles('source/**/gradle-wrapper.properties', 'source/**/*.gradle', 'source/**/*.gradle.kts', 'source/**/gradle/libs.versions.toml') }}
      - name: Configure Git for patch generation
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      - name: Apply BeefMC legacy patch set
        if: needs.resolve.outputs.build_family == 'legacy'
        working-directory: source
        run: ./beefmc setup
      - name: Set BeefMC legacy build identity
        if: needs.resolve.outputs.build_family == 'legacy'
        env:
          BEEFMC_VERSION: ${{ needs.resolve.outputs.minecraft }}
        run: python tooling/scripts/versioning/rebrand.py apply --source-root source --version "$BEEFMC_VERSION" --family legacy
      - name: Build and test legacy server
        if: needs.resolve.outputs.build_family == 'legacy'
        working-directory: source
        run: ./gradlew build --stacktrace
      - name: Apply modern patch set
        if: needs.resolve.outputs.build_family == 'modern'
        working-directory: source
        run: ./gradlew applyAllPatches --stacktrace --no-daemon
      - name: Set BeefMC build identity
        if: needs.resolve.outputs.build_family == 'modern'
        env:
          BEEFMC_VERSION: ${{ needs.resolve.outputs.minecraft }}
        run: python tooling/scripts/versioning/rebrand.py apply --source-root source --version "$BEEFMC_VERSION" --family modern
      - name: Build and test modern server
        if: needs.resolve.outputs.build_family == 'modern'
        working-directory: source
        run: ./gradlew build --stacktrace --no-daemon
      - name: Create modern runtime jar
        if: needs.resolve.outputs.build_family == 'modern'
        working-directory: source
        env:
          MINECRAFT_VERSION: ${{ needs.resolve.outputs.minecraft }}
        run: |
          if [ "$MINECRAFT_VERSION" = "1.21.11" ]; then
            ./gradlew :beefmc-server:createMojmapPaperclipJar --no-daemon
          else
            ./gradlew :beefmc-server:createPaperclipJar --no-daemon
          fi
      - name: Package modern runtime jar
        if: needs.resolve.outputs.build_family == 'modern'
        env:
          MINECRAFT_VERSION: ${{ needs.resolve.outputs.minecraft }}
        run: |
          python -m pip install --disable-pip-version-check -r tooling/scripts/versioning/requirements.txt
          python tooling/scripts/versioning/release.py package v0.0.1 "$MINECRAFT_VERSION" --source-root source --catalog tooling/versions/catalog.yml
      - name: Verify hopper amount with sleeping optimization disabled
        if: needs.resolve.outputs.build_family == 'modern'
        working-directory: source
        env:
          MINECRAFT_VERSION: ${{ needs.resolve.outputs.minecraft }}
        run: node scripts/validation/hopper-amount.mjs "dist/BeefMC-${MINECRAFT_VERSION}-v0.0.1.jar" "$JAVA_HOME/bin/java" "$RUNNER_TEMP/hopper-amount-${MINECRAFT_VERSION}-disabled" false
      - name: Verify hopper amount with sleeping optimization enabled
        if: needs.resolve.outputs.build_family == 'modern'
        working-directory: source
        env:
          MINECRAFT_VERSION: ${{ needs.resolve.outputs.minecraft }}
        run: node scripts/validation/hopper-amount.mjs "dist/BeefMC-${MINECRAFT_VERSION}-v0.0.1.jar" "$JAVA_HOME/bin/java" "$RUNNER_TEMP/hopper-amount-${MINECRAFT_VERSION}-enabled" true
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beefmc-${{ needs.resolve.outputs.minecraft }}-ci-reports-${{ github.run_id }}
          path: |
            source/**/build/reports/**
            source/**/build/test-results/**/*.xml
          if-no-files-found: ignore
          retention-days: 14
