name: BeefMC runtime validation

on:
  pull_request:
    types: [labeled]
    branches:
      - main
      - "version/**"

permissions:
  contents: read

jobs:
  runtime-validation:
    if: github.event.label.name == 'runtime-validation'
    name: Runtime check for ${{ github.event.pull_request.base.ref }}
    uses: ./.github/workflows/version-ci.yml
    with:
      source_ref: ${{ github.event.pull_request.head.sha }}
      version_branch: ${{ github.event.pull_request.base.ref }}
      tooling_ref: ${{ github.event.pull_request.head.sha }}
      runtime_validation: true
    permissions:
      contents: read
