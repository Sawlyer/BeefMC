body:
  - type: markdown
    attributes:
      value: |
        Share an idea for BeefMC. Describe the need, affected Minecraft versions, and possible solutions.
        Check existing BeefMC discussions and issues before opening a new one.

  - type: textarea
    attributes:
      label: Need or problem
      description: What problem would this idea solve?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the desired behavior.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: Describe solutions already tried or considered.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional context
      description: Add useful context or a screenshot if needed.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        This discussion is about BeefMC. Keep all proposed changes in this repository.
